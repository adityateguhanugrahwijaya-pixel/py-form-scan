services:
  app:
    build: .
    container_name: form_scanner_app
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-5001}:5001"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

